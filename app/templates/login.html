<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Person Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg:        #000000;
      --panel:     #0d0d0d;
      --panel2:    #161616;
      --border:    #262626;
      --border-st: #3a3a3a;
      --text:      #f5f5f5;
      --muted:     #999999;
      --dim:       #666666;
      --accent:    #ffffff;
      --err:       #cccccc;
    }
    body {
      font-family: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 1rem;
      font-weight: 400;
    }
    .box {
      background: var(--panel);
      padding: 2.5rem;
      border-radius: 4px;
      width: 100%; max-width: 380px;
      border: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 .25rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .sub {
      color: var(--muted);
      font-size: .75rem;
      margin-bottom: 1.75rem;
      letter-spacing: .03em;
    }
    .sub strong { color: var(--text); font-weight: 500; }

    label {
      display: block;
      font-size: .7rem;
      color: var(--muted);
      text-transform: uppercase;
      margin: 1rem 0 .4rem;
      letter-spacing: .12em;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: .7rem .9rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: .95rem;
      font-family: inherit;
      font-weight: 400;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 1.75rem;
      padding: .85rem;
      background: var(--accent);
      color: var(--bg);
      border: 0;
      border-radius: 3px;
      font-weight: 700;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    button:hover { background: #cccccc; }
    .err {
      color: var(--err);
      font-size: .8rem;
      margin-top: 1rem;
      padding: .6rem .8rem;
      background: var(--panel2);
      border: 1px solid var(--border-st);
      border-left: 3px solid var(--accent);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <form class="box" method="post">
    <h1>Person Counter</h1>
    <div class="sub">Camera: <strong>{{ camera }}</strong></div>

    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>

    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Accedi</button>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
