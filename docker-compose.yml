services:
  counter:
    build:
      context: .
      args:
        # === Scelta del modello (build-time) ===
        # CONSIGLIATO per camera a soffitto / fisheye: head-detector (1 classe "head",
        # addestrato su SCUT-HEAD) — molto meglio delle "persone" COCO viste dall'alto.
        MODEL_URL: "https://raw.githubusercontent.com/Abcfsa/YOLOv8_head_detector/main/nano.pt"
        # più accurato ma più lento: .../main/medium.pt
        #
        # Per vista frontale/laterale lascia vuoto MODEL_URL e usa COCO:
        # YOLO_MODEL: yolov8n.pt     # o yolov8s.pt (più accurato)
    image: person-counter:latest
    container_name: person-counter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # opzionale: monta un modello ONNX tuo (altrimenti usa quello in /models)
      # - ./models:/models
    environment:
      # fuso orario per gli orari di log/eventi/dashboard
      TZ: "Europe/Rome"

      # ===== Sorgente video RTSP / RTSPS (substream a bassa risoluzione) =====
      RTSP_URL: "rtsps://192.168.1.2:7441/lU1KMsla8kjpxX2P?enableSrtp"
      RTSP_TRANSPORT: "udp"          # tcp (consigliato) | udp
      CAPTURE_TIMEOUT_SEC: "5"
      CAPTURE_RECONNECT_SEC: "3"

      # ===== Detection YOLOv8n (CPU) =====
      MODEL_PATH: "/models/model.onnx"
      DETECT_FPS: "10"              # detection al secondo (alza/abbassa per CPU)
      DETECT_CONF: "0.25"           # soglia confidenza (bassa = rileva prima)
      DETECT_INPUT_SIZE: "640"
      DETECT_IOU_NMS: "0.5"
      ORT_THREADS: "4"            # 0=auto; su NUC tipicamente 2-4

      # ===== Tracking (SORT) =====
      TRACK_MAX_AGE: "15"
      TRACK_MIN_HITS: "3"
      TRACK_IOU: "0.3"

      # ===== Conteggio (linea + ROI) =====
      CAMERA_NAME: "ingresso"
      ENTER_DIRECTION: "up"         # up = entra dal basso verso l'alto
      POINT_MODE: "center"          # head-detector dall'alto: center (centro testa)
      LINE_Y: "0.50"
      LINE_MARGIN: "0.08"
      MOTION_X1: "0.05"
      MOTION_X2: "0.95"
      MOTION_Y1: "0.05"
      MOTION_Y2: "0.95"

      # ===== Overlay snapshot =====
      DRAW_OVERLAY: "1"
      JPEG_QUALITY: "75"
      SNAPSHOT_REFRESH_SEC: "2"

      # ===== Storage (JSON sempre attivo) =====
      LOG_DIR: "/data"

      # ===== Auth (vuote = dashboard pubblica) =====
      AUTH_USER: "filippo"
      AUTH_PASS: "filippo1994"
      SECRET_KEY: "metti-qui-una-stringa-random-lunga"
      SESSION_DAYS: "7"

      # ===== PostgreSQL (vuote = solo JSON) =====
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "person_counter"
      DB_USER: "counter"
      DB_PASS: "counter-pass"
      DB_SCHEMA: "public"
      DB_TABLE: "counter_events"
      DB_SSLMODE: "prefer"

      # ===== MQTT OUTPUT opzionale (pubblica i contatori) =====
      MQTT_ENABLED: "0"
      MQTT_HOST: "192.168.1.10"
      MQTT_PORT: "1883"
      MQTT_USER: ""
      MQTT_PASS: ""
      MQTT_BASE_TOPIC: "counter"

      # ===== Webhook opzionale (POST ad ogni enter/exit) =====
      WEBHOOK_ENABLED: "0"
      WEBHOOK_URL: ""
      WEBHOOK_HEADERS: ""
      WEBHOOK_TIMEOUT: "4"
      WEBHOOK_RETRY: "1"
    # Detection su CPU: opzionale limita i core per non saturare l'host
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    depends_on:
      - postgres
    networks:
      - default

  postgres:
    image: postgres:16-alpine
    container_name: person-counter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: person_counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter-pass
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - default
