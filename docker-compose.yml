services:
  # ===== Broker MQTT (l'ESP people counter pubblica qui) =====
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: person-counter-mqtt
    restart: unless-stopped
    environment:
      MQTT_USER: "espuser"
      MQTT_PASS: "esp-cambia-questa-password"
    command:
      - sh
      - -c
      - |
        rm -f /mosquitto/config/pwfile
        mosquitto_passwd -c -b /mosquitto/config/pwfile "$$MQTT_USER" "$$MQTT_PASS"
        chown mosquitto:mosquitto /mosquitto/config/pwfile
        chmod 600 /mosquitto/config/pwfile
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  # ===== App: subscriber MQTT + dashboard =====
  counter:
    build: .
    image: person-counter:latest
    container_name: person-counter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: "Europe/Rome"
      CAMERA_NAME: "ingresso"

      # ---- MQTT input (STESSE credenziali del broker) ----
      MQTT_HOST: "mosquitto"
      MQTT_PORT: "1883"
      MQTT_USER: "espuser"
      MQTT_PASS: "esp-cambia-questa-password"
      MQTT_TOPIC: "peoplecounter/#"           # = baseTopic del firmware ESP
      MQTT_ENTER_TOKENS: "enter,in,entrata"
      MQTT_EXIT_TOKENS: "exit,out,uscita"
      MQTT_PASS_TOKENS: "pass,passage,passaggio"   # l'ESP pubblica .../event = "pass"
      PASSAGE_MODE: "alternate"                # alternate => entrate≈uscite≈passaggi/2

      # ---- Auth dashboard ----
      AUTH_USER: "filippo"
      AUTH_PASS: "filippo1994"
      SECRET_KEY: "metti-qui-una-stringa-random-lunga"
      SESSION_DAYS: "7"

      # ---- PostgreSQL ----
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "person_counter"
      DB_USER: "counter"
      DB_PASS: "counter-pass"
      DB_SCHEMA: "public"
      DB_TABLE: "counter_events"
      DB_SSLMODE: "prefer"

      # ---- Webhook opzionale ----
      WEBHOOK_ENABLED: "0"
      WEBHOOK_URL: ""
      WEBHOOK_HEADERS: ""
      WEBHOOK_TIMEOUT: "4"
      WEBHOOK_RETRY: "1"
    depends_on:
      - mosquitto
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: person-counter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: person_counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter-pass
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
